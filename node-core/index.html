<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NODE Core</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" id="tc" content="#F3F6F6">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NODE Core">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#F3F6F6;overflow:hidden}
  iframe{position:fixed;top:0;left:0;right:0;width:100%;height:100%;border:0;padding:env(safe-area-inset-top) 0 0 0;box-sizing:border-box;background:inherit}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:15px system-ui,sans-serif;color:#5A6E73;gap:12px;flex-direction:column}
  #load img{width:96px;height:96px;border-radius:18px}
</style>
<script>
  /* bar and background colours follow the app's day / night mode (the app tells us; the last choice is remembered) */
  var COL = { light: "#F3F6F6", dark: "#0E1719" };
  function setTheme(t){
    var c = COL[t] || COL.light;
    document.getElementById("tc").setAttribute("content", c);
    document.documentElement.style.background = c; if (document.body) document.body.style.background = c;
    try { localStorage.setItem("nodeTheme", t); } catch (e) {}
  }
  try { var t0 = localStorage.getItem("nodeTheme"); if (t0) document.addEventListener("DOMContentLoaded", function(){ setTheme(t0); }); } catch (e) {}
  window.addEventListener("message", function(e){ if (e.data && e.data.nodeTheme) setTheme(e.data.nodeTheme); });
</script>
</head>
<body>
<div id="load"><img src="icon-192.png" alt=""><span>NODE Core…</span></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzHNVw7X_8cWKXxEEmhHFPPopKSAwBrSmMZBiNlTr2mZTDjVHBas4EPIS2kdn8oIqmj/exec" title="NODE Core" allow="clipboard-write; camera" onload="document.getElementById('load').style.display='none'"></iframe>
<script>
  /* the keyboard must not shrink the app: the frame keeps the full screen height (only a turn of the phone changes it),
     so the Google pages around NODE Core are not resized and their white background does not flash under the keyboard */
  (function(){
    var f = document.getElementById("app"), H = 0, W = window.innerWidth;
    function fit(){
      var h = Math.max(window.innerHeight, document.documentElement.clientHeight);
      if (window.innerWidth !== W) { W = window.innerWidth; H = 0; }   // turned: measure again
      if (h > H) { H = h; f.style.height = H + "px"; }
    }
    fit(); window.addEventListener("resize", fit); window.addEventListener("orientationchange", function(){ setTimeout(function(){ W = -1; fit(); }, 300); });
  })();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
